# ai-first · guarda de governança (server-side)
#
# TEMPLATE — o /ai-first:ai-first-init copia para `.github/workflows/` do repo que adota o método.
# É a camada de FORÇA no servidor: torna a violação do fluxo impossível de MERGEAR (não só
# desaconselhada). Marque os jobs abaixo como REQUIRED CHECKS na branch protection de `develop`
# e `main` (ver docs/governance/enforcement.md) — sem isso, o workflow só avisa, não impede.
name: ai-first · guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  git-flow:
    name: Disciplina de fluxo (feature → develop → main)
    runs-on: ubuntu-latest
    steps:
      - name: Valida base/head e rastreabilidade
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          echo "PR $HEAD → $BASE  [labels: ${LABELS:-none}]"
          fail() { echo "::error::$1"; exit 1; }

          case "$BASE" in
            main)
              # Só a promoção develop → main chega em main.
              [ "$HEAD" = "develop" ] || fail "Só \`develop\` promove para \`main\` (head=$HEAD). Feature vai para develop."
              ;;
            develop)
              # Feature vem de uma branch claude/<slug>.
              case "$HEAD" in
                claude/*) : ;;
                *) fail "PR contra develop deve vir de \`claude/<slug>\` (head=$HEAD)." ;;
              esac
              # Rastreabilidade: mudança de comportamento fecha uma issue.
              if echo ",$LABELS," | grep -qiE ',(promotion|no-issue|docs),'; then
                echo "Rastreabilidade dispensada por label."
              elif echo "${BODY:-}" | grep -qiE 'Closes #[0-9]+'; then
                echo "OK: PR referencia uma issue (Closes #)."
              else
                fail "PR de feature precisa de \`Closes #NNN\` (ou label docs/no-issue/promotion)."
              fi
              ;;
            *) echo "Base $BASE fora do fluxo governado — ignorado." ;;
          esac
          echo "Fluxo de git OK."

  fitness:
    name: Fitness functions (invariantes executáveis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Roda a suíte de fitness do repo (se existir)
        run: |
          set -euo pipefail
          if [ -f scripts/ai-first-fitness.mjs ]; then
            # PROVA DE MUTAÇÃO ANTES DO CHECK (ADR-0020): primeiro se prova que a régua MEDE (cada
            # regra dispara contra o menor repo que a viola), só então se mede. Invertido, um regex
            # furado passaria em silêncio verde e o gate viraria teatro.
            node scripts/ai-first-fitness.mjs --verify
            node scripts/ai-first-fitness.mjs
            # Comportamento dos grafos contratados (ADR-0019) — o caminho quente do método tem teste.
            [ -f scripts/check-workflows.mjs ] && node scripts/check-workflows.mjs || true
          else
            echo "Sem scripts/ai-first-fitness.mjs ainda — invariantes checadas pela suíte de testes do repo (ci.yml)."
            echo "Próxima fatia do enforcement: materializar as fitness functions (ver docs/governance/enforcement.md)."
          fi

  # Trava de política (ADR-0020) — o freio contra o caminho mais barato até o verde: BAIXAR A RÉGUA.
  # Duas checagens distintas: (a) a régua não derivou nem afrouxou; (b) se o PR toca governança, isso
  # está DECLARADO. Marque este job como required check junto com `git-flow` e `fitness`.
  policy-lock:
    name: Trava de política (só aperta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa da base para comparar o diff do PR

      - name: Integridade da trava (digest selado + knobs que só apertam)
        run: |
          set -euo pipefail
          if [ -f scripts/policy-lock.mjs ]; then
            node scripts/policy-lock.mjs
          else
            echo "Sem scripts/policy-lock.mjs — trava não instalada (ver docs/governance/enforcement.md §4b)."
          fi

      - name: Mudança de régua tem de ser DECLARADA
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD" || true)
          PROTEGIDO=$(echo "$CHANGED" | grep -E '^(\.github/workflows/|\.github/CODEOWNERS|hooks/|\.ai-first/hooks/|scripts/(ai-first-fitness|policy-lock|check-coherence|check-workflows)\.mjs|scripts/fitness-fixtures/|docs/governance/|docs/sdd/constitution\.md|\.claude/workflows/|\.claude/settings\.json)' || true)
          if [ -z "$PROTEGIDO" ]; then
            echo "PR não toca superfície de governança — nada a declarar."
            exit 0
          fi
          echo "Superfícies de governança tocadas:"; echo "$PROTEGIDO" | sed 's/^/  · /'
          if echo ",$LABELS," | grep -qi ',policy-change,' || echo "${BODY:-}" | grep -qiE '^Policy-Change:'; then
            echo "OK: mudança de régua declarada (label \`policy-change\` ou linha \`Policy-Change:\` no corpo)."
            echo "::warning::Este PR altera a RÉGUA. Exige revisão humana nomeada (CODEOWNERS) mesmo em autonomy_level autônomo."
          else
            echo "::error::PR altera superfície de governança sem declarar. Adicione a label \`policy-change\` OU a linha \`Policy-Change: <motivo>\` no corpo do PR, e rode \`node scripts/policy-lock.mjs --seal\`."
            exit 1
          fi
